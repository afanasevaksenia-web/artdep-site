name: Build

on:
  push:
    branches:
      - agent/rekvizit-ceh-supabase
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm run build
